# Render blueprint for the SalesPos API.
#
# Must live at the repository root: Render's Blueprint feature only looks
# for render.yaml here, never in a subdirectory. `rootDir` below is what
# points it at the Django project.
#
# Point Render at this file (New -> Blueprint) and it creates the service with
# the right build and start commands. DATABASE_URL and CORS_ALLOWED_ORIGINS are
# left blank on purpose: fill them in the dashboard once Neon and Vercel exist.
services:
  - type: web
    name: salespos-api
    runtime: python
    plan: free
    # The Django project lives in backend/, not the repo root.
    rootDir: backend
    buildCommand: "./build.sh"
    startCommand: "gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 60"
    healthCheckPath: /api/health/
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.2"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "0"
      # No DJANGO_ALLOWED_HOSTS here on purpose: a blueprint cannot resolve
      # `fromService` against the service it is creating, so it arrived empty
      # and Django answered 400 to everything. settings.py reads Render's own
      # RENDER_EXTERNAL_HOSTNAME instead.
      # Paste the Neon pooled connection string in the dashboard.
      - key: DATABASE_URL
        sync: false
      # Your Vercel URL, e.g. https://salespos.vercel.app
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      # Where shops send their subscriptions. Every one is optional and set in
      # the dashboard only, never committed here — but until at least one is
      # set, the billing page has no number to show and nobody can pay.
      #
      # MTN MoMo: a real MTN Uganda line (076/077/078/079/039) or it is dropped.
      - key: SUBSCRIPTION_MOMO_NUMBER
        sync: false
      - key: SUBSCRIPTION_MOMO_NAME
        sync: false
      # Airtel Money: 070/074/075/020, same rule.
      - key: SUBSCRIPTION_AIRTEL_NUMBER
        sync: false
      - key: SUBSCRIPTION_AIRTEL_NAME
        sync: false
      # Bank transfer, which is also how a card pays — there is no card gateway.
      - key: SUBSCRIPTION_BANK_NAME
        sync: false
      - key: SUBSCRIPTION_BANK_ACCOUNT_NAME
        sync: false
      - key: SUBSCRIPTION_BANK_ACCOUNT_NUMBER
        sync: false
      - key: SUBSCRIPTION_BANK_BRANCH
        sync: false
      # Flutterwave: cards and Ugandan mobile money on one hosted page. The
      # secret key makes the option appear; the secret hash is what turns a
      # completed payment into an active plan. In the Flutterwave dashboard set
      # Settings -> Webhooks to:
      #   https://<this-service>.onrender.com/api/billing/flutterwave-webhook/
      # with the same secret hash you put here.
      - key: FLUTTERWAVE_SECRET_KEY
        sync: false
      - key: FLUTTERWAVE_SECRET_HASH
        sync: false
      - key: FLUTTERWAVE_PAYMENT_OPTIONS
        sync: false
      # Your Vercel URL, so Flutterwave returns the shop to the billing page.
      - key: APP_BASE_URL
        sync: false
      - key: JWT_ACCESS_MINUTES
        value: "60"
      - key: JWT_REFRESH_DAYS
        value: "14"

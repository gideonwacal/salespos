# Render blueprint for the SalesPos API.
#
# Must live at the repository root: Render's Blueprint feature only looks
# for render.yaml here, never in a subdirectory. `rootDir` below is what
# points it at the Django project.
#
# Point Render at this file (New -> Blueprint) and it creates the service with
# the right build and start commands. DATABASE_URL and CORS_ALLOWED_ORIGINS are
# left blank on purpose: fill them in the dashboard once Neon and Vercel exist.
services:
  - type: web
    name: salespos-api
    runtime: python
    plan: free
    # The Django project lives in backend/, not the repo root.
    rootDir: backend
    buildCommand: "./build.sh"
    startCommand: "gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 60"
    healthCheckPath: /api/health/
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.2"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "0"
      # No DJANGO_ALLOWED_HOSTS here on purpose: a blueprint cannot resolve
      # `fromService` against the service it is creating, so it arrived empty
      # and Django answered 400 to everything. settings.py reads Render's own
      # RENDER_EXTERNAL_HOSTNAME instead.
      # Paste the Neon pooled connection string in the dashboard.
      - key: DATABASE_URL
        sync: false
      # Your Vercel URL, e.g. https://salespos.vercel.app
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: JWT_ACCESS_MINUTES
        value: "60"
      - key: JWT_REFRESH_DAYS
        value: "14"

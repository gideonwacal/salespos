# Render blueprint for the SalesPos API.
#
# Must live at the repository root: Render's Blueprint feature only looks
# for render.yaml here, never in a subdirectory. `rootDir` below is what
# points it at the Django project.
#
# Point Render at this file (New -> Blueprint) and it creates the service with
# the right build and start commands. DATABASE_URL and CORS_ALLOWED_ORIGINS are
# left blank on purpose: fill them in the dashboard once Neon and Vercel exist.
services:
  - type: web
    name: salespos-api
    runtime: python
    plan: free
    # The Django project lives in backend/, not the repo root.
    rootDir: backend
    buildCommand: "./build.sh"
    startCommand: "gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 60"
    healthCheckPath: /api/health/
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.2"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "0"
      # No DJANGO_ALLOWED_HOSTS here on purpose: a blueprint cannot resolve
      # `fromService` against the service it is creating, so it arrived empty
      # and Django answered 400 to everything. settings.py reads Render's own
      # RENDER_EXTERNAL_HOSTNAME instead.
      # Paste the Neon pooled connection string in the dashboard.
      - key: DATABASE_URL
        sync: false
      # Your Vercel URL, e.g. https://salespos.vercel.app
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      # Where shops send their subscriptions. Every one is optional and set in
      # the dashboard only, never committed here — but until at least one is
      # set, the billing page has no number to show and nobody can pay.
      #
      # MTN MoMo: a real MTN Uganda line (076/077/078/079/039) or it is dropped.
      - key: SUBSCRIPTION_MOMO_NUMBER
        sync: false
      - key: SUBSCRIPTION_MOMO_NAME
        sync: false
      # Airtel Money: 070/074/075/020, same rule.
      - key: SUBSCRIPTION_AIRTEL_NUMBER
        sync: false
      - key: SUBSCRIPTION_AIRTEL_NAME
        sync: false
      # Bank transfer, which is also how a card pays — there is no card gateway.
      - key: SUBSCRIPTION_BANK_NAME
        sync: false
      - key: SUBSCRIPTION_BANK_ACCOUNT_NAME
        sync: false
      - key: SUBSCRIPTION_BANK_ACCOUNT_NUMBER
        sync: false
      - key: SUBSCRIPTION_BANK_BRANCH
        sync: false
      # Mobile money collections, straight from the telcos. With these set a
      # shop approves a PIN prompt on its own phone and the plan turns on by
      # itself; without them the manual numbers above are used instead.
      # Keep MTN_MOMO_ENVIRONMENT as "sandbox" until MTN approves production,
      # then set it to "mtnuganda" and clear MTN_MOMO_BASE_URL.
      - key: MTN_MOMO_SUBSCRIPTION_KEY
        sync: false
      - key: MTN_MOMO_API_USER
        sync: false
      - key: MTN_MOMO_API_KEY
        sync: false
      - key: MTN_MOMO_ENVIRONMENT
        sync: false
      - key: AIRTEL_CLIENT_ID
        sync: false
      - key: AIRTEL_CLIENT_SECRET
        sync: false
      - key: AIRTEL_BASE_URL
        sync: false
      # Your Vercel URL.
      - key: APP_BASE_URL
        sync: false
      # Sending the sign-up confirmation. Without EMAIL_HOST no mail goes out
      # and new owners cannot confirm — set these, or set
      # REQUIRE_EMAIL_VERIFICATION to 0 to skip the check entirely.
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_PORT
        sync: false
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: DEFAULT_FROM_EMAIL
        sync: false
      - key: REQUIRE_EMAIL_VERIFICATION
        sync: false
      # The platform owner's login for the Control Room. Set both and the
      # account is created on the next deploy; change the password and
      # redeploy to reset it. Render's free tier has no shell, so this is the
      # only way to make one.
      # On by default: 14 days free, then 25,000 UGX buys three months — or
      # five referred signups buy three days, once. Set to 0 to give the
      # product away again; nothing is deleted either way.
      - key: BILLING_ENABLED
        sync: false
      - key: PLATFORM_ADMIN_EMAIL
        sync: false
      - key: PLATFORM_ADMIN_PASSWORD
        sync: false
      - key: JWT_ACCESS_MINUTES
        value: "60"
      - key: JWT_REFRESH_DAYS
        value: "14"
      # --- the WhatsApp assistant ---
      # All optional. With none of these set the assistant simply reports
      # itself unavailable; nothing else in the app changes.
      #
      # Gemini: aistudio.google.com/apikey. The free tier is enough to try it.
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: "gemini-2.0-flash"
      # Meta WhatsApp Cloud API: developers.facebook.com -> WhatsApp -> API Setup.
      - key: WHATSAPP_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      # You invent this one, then type the same value into Meta's webhook page.
      - key: WHATSAPP_VERIFY_TOKEN
        sync: false
      # App Settings -> Basic -> App Secret. Not optional in practice: without
      # it the webhook refuses every request, because an unsigned webhook URL
      # is an open door into the business's data.
      - key: WHATSAPP_APP_SECRET
        sync: false
      # Only needed to send reminders to customers. Meta requires an approved
      # template before a business may open a conversation.
      - key: WHATSAPP_REMINDER_TEMPLATE
        sync: false
      # The greeting sent to a shop's WhatsApp number the moment they sign up.
      # Must be an approved template: Meta will not deliver free text to
      # someone who has not messaged the business first. Two placeholders, in
      # order - the business name, then the pairing code.
      - key: WHATSAPP_WELCOME_TEMPLATE
        sync: false
      - key: WHATSAPP_TEMPLATE_LANGUAGE
        value: "en"
